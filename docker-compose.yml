services:
  backend:
    build: .
    container_name: backend-api
    ports:
      - "${backend_port_api:-8080}:${backend_port_api:-8080}"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${backend_host:-db}:${backend_port:-5432}/${backend_database:-backend}
      SPRING_DATASOURCE_USERNAME: ${backend_user:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${backend_password:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-PRODUCTION}
      FRONTEND_URL: ${FRONTEND_URL:-https://inmero.co/sigcon}
    deploy:
      resources:
        limits:
          memory: 384M

  db:
    image: postgres:15
    container_name: backend-db
    restart: always
    environment:
      POSTGRES_DB: ${backend_database:-backend}
      POSTGRES_USER: ${backend_user:-postgres}
      POSTGRES_PASSWORD: ${backend_password:-postgres}
    ports:
      - "${backend_port:-5432}:${backend_port:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: backend-pgadmin
  #   ports:
  #     - "5050:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   depends_on:
  #     - db

  adminer:
    image: adminer
    container_name: backend-adminer
    restart: always
    ports:
      - "${backend_port_adminer:-8081}:${backend_port_api:-8080}"
    depends_on:
      - db

volumes:
  postgres_data:

