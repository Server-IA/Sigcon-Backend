# QA Bloque BM: compose para simular Dokploy productivo (mocks NO cargan).
# Uso: docker compose -f docker-compose.prodsim.yml up --build -d
services:
  backend:
    build: .
    container_name: sigcon-prodsim-api
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/backend
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: PRODUCTION
      # SIGCON_INTEGRATION_MOCKS_ENABLED INTENCIONALMENTE OMITIDO
      LOGGING_LEVEL_COM_SIGCON_BACKEND: INFO
      CORS_ALLOWED_ORIGINS: https://inmero.co
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: postgres:15
    container_name: sigcon-prodsim-db
    restart: always
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
