# Configuration for dev profile (local development)
# This file is automatically activated when SPRING_PROFILES_ACTIVE=dev

# Database (use default values or override with environment variables)
spring.datasource.url=jdbc:postgresql://${backend_host:db}:${backend_port_db_dev:5443}/${backend_database:backend}
spring.datasource.username=${backend_user:postgres}
spring.datasource.password=${backend_password:postgres}

# JPA / Hibernate
# QA-BLOQUE-AN (2026-04-29): show-sql=false por defecto. Cuando dev local necesita
# ver SQL, exportar SPRING_JPA_SHOW_SQL=true antes de levantar el container.
# show-sql=true generaba ~50 lineas/request y disparaba OOMKilled (exit 137) en Dokploy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Springdoc / OpenAPI / Swagger
# server.servlet.context-path=/sigcon/dev
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Additional Swagger UI configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# springdoc.swagger-ui.url=/sigcon/dev/v3/api-docs
# springdoc.swagger-ui.config-url=/sigcon/dev/v3/api-docs/swagger-config

