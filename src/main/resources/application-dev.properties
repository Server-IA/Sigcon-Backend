# Logging
# QA-BLOQUE-AN (2026-04-29): bajado de DEBUG a INFO por OOMKilled en Dokploy.
# DEBUG generaba ~150 lineas/request entre el filter chain de Spring y queries
# Hibernate. Para DEBUG temporal: exportar LOGGING_LEVEL_COM_SIGCON_BACKEND=DEBUG
# antes de arrancar (ENV var sobrescribe el .properties).
logging.level.org.springframework.web=INFO
logging.level.com.sigcon.backend=INFO

# QA-BLOQUE-AN (2026-04-29): silenciar los WARN cosmeticos que Hibernate emite
# cuando intenta dropear constraints generados con nombres random
# (ukibvoggbe8ijw4l7xyyotp5n7g, etc.) que no existen en BD limpia. Son no-ops
# emitidos por hbm2ddl.auto=update y NO afectan la funcionalidad. ERROR sube
# el threshold para que solo aparezcan errores reales (no warnings de DDL).
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR