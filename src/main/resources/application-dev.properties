# Configuration for dev profile (local development)
# This file is automatically activated when SPRING_PROFILES_ACTIVE=dev

# Database (use default values or override with environment variables)
spring.datasource.url=jdbc:postgresql://${backend_host:db}:${backend_port_db_dev:5443}/${backend_database:backend}
spring.datasource.username=${backend_user:postgres}
spring.datasource.password=${backend_password:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Springdoc / OpenAPI / Swagger
server.servlet.context-path=/sigcon/dev
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Additional Swagger UI configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Mail (existing configuration)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sigconsigcon@gmail.com
spring.mail.password=ovbg xily mxpv zguu
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Storage
app.storage.avatar-dir=uploads/avatars

# JWT Secret
jwt.secret=E54791C31B99A58F25677B21FAECD57AB89CDEF1234567890ABCDEF12345678

# Server
server.port=8080

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.sigcon.backend=DEBUG