spring.mail.password=ovbg xily mxpv zguu
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.storage.avatar-dir=uploads/avatars
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
app.frontend.url=${FRONTEND_URL:https://inmero.co/sigcon}

# Springdoc / OpenAPI / Swagger
# server.servlet.context-path=/sigcon/dev
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# springdoc.swagger-ui.url=/sigcon/dev/v3/api-docs
# springdoc.swagger-ui.config-url=/sigcon/dev/v3/api-docs/swagger-config

# Additional Swagger UI configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Sprint Final: aumentar header size para JWT con 200+ authorities
server.max-http-request-header-size=65536
server.tomcat.max-http-header-size=65536

# ── HU-AU-09: Respaldo de logs de auditoria en BD EXTERNA ──────────────────
# Conexion JDBC directa a la BD externa de respaldo (tabla audit_backup).
# Overridable por variables de entorno en Dokploy (AUDIT_BACKUP_*).
audit-backup.url=${AUDIT_BACKUP_URL:jdbc:postgresql://158.69.200.27:5441/backend}
audit-backup.username=${AUDIT_BACKUP_USERNAME:postgres}
audit-backup.password=${AUDIT_BACKUP_PASSWORD:postgres}
audit-backup.batch-size=${AUDIT_BACKUP_BATCH_SIZE:500}
audit-backup.max-attempts=${AUDIT_BACKUP_MAX_ATTEMPTS:5}
audit-backup.retry-delay-ms=${AUDIT_BACKUP_RETRY_DELAY_MS:5000}
audit-backup.cron=${AUDIT_BACKUP_CRON:0 0/5 * * * *}
# Scheduler DESHABILITADO por defecto: la transferencia automatica solo corre si
# AUDIT_BACKUP_ENABLED=true. El disparo manual (endpoint admin) funciona siempre.
audit-backup.enabled=${AUDIT_BACKUP_ENABLED:false}
