spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${backend_host}:${backend_port}/${backend_database}
spring.datasource.username=${backend_user}
spring.datasource.password=${backend_password}

spring.jpa.hibernate.ddl-auto=update
# QA-BLOQUE-AN (2026-04-29): show-sql=false. Si necesitas SQL trace local,
# exportar SPRING_JPA_SHOW_SQL=true. show-sql=true mato Dokploy con OOMKilled.
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# QA-BLOQUE-AN (2026-04-29): silenciar WARN cosmeticos de Hibernate cuando
# intenta dropear constraints con nombres random durante hbm2ddl=update.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR

jwt.secret= E54791C31B99A58F25677B21FAECD57AB89CDEF1234567890ABCDEF12345678

spring.mail.host=smtp.gmail.com
spring.mail.port=587
