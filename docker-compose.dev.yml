version: "3.8"

# Docker Compose para desarrollo con Swagger habilitado
# Uso: docker-compose -f docker-compose.dev.yml up --build

services:
  backend:
    build: .
    container_name: backend-dev-api
    ports:
      - "${backend_port_api}:${backend_port_api}"
    depends_on:
      - ${backend_host}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${backend_host}:${backend_port_db_dev}/${backend_database}
      SPRING_DATASOURCE_USERNAME: ${backend_user:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${backend_password:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
      LOGGING_LEVEL_COM_SIGCON_BACKEND: DEBUG
      SPRING_PROFILES_ACTIVE: dev  

    deploy:
      resources:
        limits:
          memory: 512M  # Más memoria para desarrollo

  db:
    image: postgres:15
    container_name: backend-dev-db
    restart: always
    environment:
      POSTGRES_DB: ${backend_database}
      POSTGRES_USER: ${backend_user}
      POSTGRES_PASSWORD: ${backend_password}
    ports:
      - "${backend_port_db_dev}:${backend_port_db_dev}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  # adminer:
  #   image: adminer
  #   container_name: backend-dev-adminer
  #   restart: always
  #   ports:
  #     - "${backend_port_adminer}:${backend_port_api}"
  #   depends_on:
  #     - ${backend_host:-db}

volumes:
  postgres_data_dev: