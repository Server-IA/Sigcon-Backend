version: "3.8"

# Docker Compose para desarrollo con Swagger habilitado
# Uso: docker-compose -f docker-compose.dev.yml up --build

services:
  backend:
    build: .
    container_name: backend-dev-api
    ports:
      - "${backend_port_api}:${backend_port_api}"
    # depends_on:
    #   db:
    #     condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${backend_host}:${backend_port_db_dev}/${backend_database}
      SPRING_DATASOURCE_USERNAME: ${backend_user}
      SPRING_DATASOURCE_PASSWORD: ${backend_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # QA-BLOQUE-AN (2026-04-29): logging bajado de DEBUG a INFO. DEBUG generaba
      # ~150 lineas por request (queries Hibernate + Spring Web filter chain) y
      # mato el container con OOMKilled. Si se necesita DEBUG temporal, re-activar
      # solo el modulo afectado (ej. LOGGING_LEVEL_COM_SIGCON_BACKEND_INTEGRATION: DEBUG).
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      LOGGING_LEVEL_COM_SIGCON_BACKEND: INFO
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: dev

    # QA-BLOQUE-AN (2026-04-29): mem_limit (Compose v2 hard limit) + deploy.resources
    # (Swarm hint). Dokploy honra mem_limit. Subido de 512MB a 1GB tras OOMKilled.
    mem_limit: 1024m
    mem_reservation: 768m
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 768M

  # db:
